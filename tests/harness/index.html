<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status Timeline Chart test</title>
<link rel="stylesheet" href="../../dist/tmp/widgets/digei/statustimelinechart/StatusTimelineChart.css">
<style>
  body { margin: 0; padding: 20px; background: #f5f5f4; font-family: "Open Sans", "Segoe UI", sans-serif; font-size: 14px; }
  #root { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .cell.wide { grid-column: 1 / -1; }
  @media (max-width: 700px) { #root { grid-template-columns: minmax(0, 1fr); } }
  #db { grid-column: 1 / -1; font: 12px Consolas, monospace; color: #333; }
  .cell { background: #fff; border: 1px solid #e4e3df; border-radius: 6px; padding: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="db" style="padding:8px 20px;font:12px Consolas,monospace">attribute value: (not changed yet)</div>
<script src="out/harness.js"></script>
</body>
</html>
